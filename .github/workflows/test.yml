name: Test

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -race -timeout 5m

  docs:
    name: Documentation is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@latest generate
      - name: Fail if generated docs differ from the committed ones
        run: git diff --exit-code -- docs/

  acceptance:
    name: Acceptance tests
    runs-on: ubuntu-latest
    # Acceptance tests talk to the real playit API and create billable objects,
    # so they only run when a secret key is configured for the repository.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.*'
          terraform_wrapper: false
      - run: go test ./... -v -timeout 20m
        env:
          TF_ACC: '1'
          PLAYIT_SECRET_KEY: ${{ secrets.PLAYIT_SECRET_KEY }}
